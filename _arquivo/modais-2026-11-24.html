<!-- Modais arquivados em 24/11/2026 (decisão 13 do anexo 8). Os cards que os abriam saíram do snapshot
     (companheiro_sync tira reflexao/daylog/diarioHist/comer/terapia/vicios). Pra voltar: colar de volta no index.html. -->
  <div class="modal-backdrop" id="diarioHistModal" hidden>
    <div class="modal modal-tall">
      <h3>Diário <span class="lista-n" id="dhN"></span></h3>
      <div class="lista-corpo" id="dhCorpo"></div>
      <div class="modal-actions"><button id="dhFechar" class="btn">fechar</button></div>
    </div>
  </div>
  <div class="modal-backdrop" id="diarioEditModal" hidden>
    <div class="modal">
      <h3 id="deTitulo">Editar dia</h3>
      <div class="day-moods" id="deMoods">
        <button class="dmood" data-mood="leve"><span class="dmood-emoji">😊</span>leve</button>
        <button class="dmood" data-mood="normal"><span class="dmood-emoji">😐</span>normal</button>
        <button class="dmood" data-mood="puxado"><span class="dmood-emoji">😩</span>puxado</button>
      </div>
      <label>Uma frase <textarea id="deNote" rows="2"></textarea></label>
      <label>O que aprendi <textarea id="deLearn" rows="2"></textarea></label>
      <label>Faria diferente <textarea id="deChange" rows="2"></textarea></label>
      <!-- "uma boa notícia" NÃO entra aqui: no Mac ela mora no capLog do state, não no diário. Editar
           esse campo por aqui gravaria um dado que nenhuma tela do Mac lê. Ela segue no fechar o dia. -->
      <div class="modal-actions">
        <button id="deCancel" class="btn ghost">cancelar</button>
        <button id="deSave" class="btn">✓ salvar</button>
      </div>
    </div>
  </div>
  <div class="modal-backdrop" id="terapiaModal" hidden>
    <div class="modal modal-tall">
      <h3>Terapia</h3>
      <div class="start-fmt" id="terTabs">
        <button data-t="reg" class="on">registro</button><button data-t="grat">gratidão</button>
      </div>
      <div class="lista-corpo">
        <div id="terReg">
          <label>Situação <textarea id="trSit" rows="2" placeholder="o que aconteceu"></textarea></label>
          <label>Emoção <input type="text" id="trEmo" placeholder="ex: ansiedade, raiva, vergonha"></label>
          <label>Intensidade <span id="trScoreV" class="lista-n">5</span> <input type="range" id="trScore" min="0" max="10" value="5"></label>
          <label>Pensamento <textarea id="trTho" rows="2" placeholder="o que passou pela cabeça"></textarea></label>
          <!-- PARIDADE-TERAPIA-2026-09-08 · o campo existe no terapia.html e o app mandava '' fixo:
               o registro chegava no Mac sempre sem distorção, e é justamente o passo que dá o nome
               ao padrão. Mesmas 10 opções do widget, na mesma ordem. -->
          <label>Distorção (opcional) <select id="trDist">
            <option value="">— escolher —</option>
            <option>Catastrofização (pior cenário)</option>
            <option>Leitura de mente (assumir o que os outros pensam)</option>
            <option>Generalização ("sempre" / "nunca")</option>
            <option>Etiquetagem ("sou idiota", "sou fraco")</option>
            <option>Raciocínio emocional ("sinto, logo é")</option>
            <option>Pensamento "deveria"</option>
            <option>Filtro mental (só vê o ruim)</option>
            <option>Polarização (tudo ou nada)</option>
            <option>Personalização (culpa indevida)</option>
            <option>Magnificação / minimização</option>
          </select></label>
          <label>Resposta mais gentil (opcional) <textarea id="trResp" rows="2" placeholder="o que você diria pra um amigo nessa situação"></textarea></label>
        </div>
        <div id="terGrat" hidden>
          <!-- PARIDADE-TERAPIA-2026-09-08 · o "por quê" de cada item e o da pessoa existem no Mac e
               o app mandava '' fixo. É a parte que faz a gratidão render alguma coisa. -->
          <label>Grato por... <input type="text" id="tg1" placeholder="1ª coisa"></label>
          <label>&nbsp;<input type="text" id="tgw1" placeholder="por quê (opcional)"></label>
          <label>&nbsp;<input type="text" id="tg2" placeholder="2ª (opcional)"></label>
          <label>&nbsp;<input type="text" id="tgw2" placeholder="por quê (opcional)"></label>
          <label>&nbsp;<input type="text" id="tg3" placeholder="3ª (opcional)"></label>
          <label>&nbsp;<input type="text" id="tgw3" placeholder="por quê (opcional)"></label>
          <label>Uma pessoa (opcional) <input type="text" id="tgPessoa" placeholder="quem fez diferença hoje"></label>
          <label>&nbsp;<input type="text" id="tgPessoaWhy" placeholder="o que ela fez"></label>
        </div>
      </div>
      <div class="modal-actions">
        <button id="terCancel" class="btn ghost">cancelar</button>
        <button id="terSave" class="btn">✓ guardar</button>
      </div>
    </div>
  </div>
  <div class="modal-backdrop" id="viciosModal" hidden>
    <div class="modal modal-tall">
      <h3>Vícios</h3>
      <div class="start-fmt" id="vicTabs">
        <button data-t="halt" class="on">check HALT</button><button data-t="surf">surfei a fissura</button><button data-t="cont">contadores</button>
      </div>
      <div class="lista-corpo">
        <div id="vicHalt">
          <p class="leit-hint">Antes de ceder, cheque o que está por trás:</p>
          <div class="halt-chips" id="haltChips">
            <button data-h="hungry">🍽 fome</button><button data-h="angry">😤 raiva</button>
            <button data-h="lonely">🫥 solidão</button><button data-h="tired">🥱 cansaço</button>
          </div>
        </div>
        <div id="vicSurf" hidden>
          <label>Fissura antes <span id="vsAntesV" class="lista-n">5</span> <input type="range" id="vsAntes" min="0" max="10" value="5"></label>
          <label>Depois de surfar <span id="vsDepoisV" class="lista-n">2</span> <input type="range" id="vsDepois" min="0" max="10" value="2"></label>
          <label>Quantos minutos durou <input type="number" id="vsMin" min="0" inputmode="numeric" placeholder="ex: 5"></label>
          <label>Gatilho (opcional) <input type="text" id="vsGatilho" placeholder="o que acendeu"></label>
        </div>
        <!-- PARIDADE-VICIOS-2026-09-08 · contador de sobriedade. Criar e editar continua no Mac (é
             decisão fria, de mesa); o que precisa estar aqui é VER quantos dias e registrar a recaída,
             que acontece longe do computador. Os campos são os mesmos do modal do vicios.html porque o
             mapa de risco lê exatamente eles. -->
        <div id="vicCont" hidden>
          <div id="vicContLista"></div>
          <div id="vicLapsoForm" hidden>
            <p class="leit-hint" id="vicLapsoQual"></p>
            <div class="halt-chips" id="vicLapsoHalt">
              <button data-h="hungry">🍽 fome</button><button data-h="angry">😤 raiva</button>
              <button data-h="lonely">🫥 solidão</button><button data-h="tired">🥱 cansaço</button>
            </div>
            <label>Onde <input type="text" id="vlPlace" placeholder="ex: em casa, no carro"></label>
            <label>Contexto <select id="vlContext">
              <option value="">— escolher —</option>
              <option value="alone">sozinho</option>
              <option value="people">com gente presencial</option>
              <option value="online">online (chat, redes)</option>
              <option value="work">no meio do trabalho</option>
            </select></label>
            <label>Gatilho percebido <input type="text" id="vlTrigger" placeholder="emoção, evento, pensamento"></label>
            <label>O que aprendeu (opcional) <textarea id="vlNote" rows="2" placeholder="sem culpa"></textarea></label>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button id="vicCancel" class="btn ghost">cancelar</button>
        <button id="vicSave" class="btn">✓ registrar</button>
      </div>
    </div>
  </div>
  <div class="modal-backdrop" id="comerModal" hidden>
    <div class="modal">
      <h3>Adicionar item</h3>
      <input type="text" id="comerSearch" class="cm-search" placeholder="buscar (ex: iogurte, grão, pão)…">
      <div id="comerModalList" class="cm-modallist"></div>
      <div class="modal-actions"><button id="comerModalClose" class="btn">pronto</button></div>
    </div>
  </div>
  <div class="modal-backdrop" id="reflModal" hidden>
    <div class="modal">
      <h3>Reflexão do dia</h3>
      <div class="refl-q" id="reflModalQ"></div>
      <label>Sua resposta <textarea id="reflInput" rows="4" placeholder="responde numa linha — a criatura guarda pra você"></textarea></label>
      <div class="modal-actions">
        <button id="reflCancel" class="btn ghost">agora não</button>
        <button id="reflSave" class="btn">guardar</button>
      </div>
    </div>
  </div>
